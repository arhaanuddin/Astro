<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Astronet</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Animated Star Background -->
    <div class="star-field">
        <div class="stars-layer stars-small"></div>
        <div class="stars-layer stars-medium"></div>
        <div class="stars-layer stars-large"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="index.html" class="logo">ASTRONET</a>
                <h1>Welcome Back</h1>
                <p>Sign in to access your account</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <div class="form-error" id="loginError"></div>

                <button type="submit" class="btn btn-primary btn-full">
                    <span>Sign In</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="demo-credentials">
                <p><strong>Demo Accounts:</strong></p>
                <p>Member: <code>member</code> / <code>member123</code></p>
                <p>Admin: <code>admin</code> / <code>admin123</code></p>
            </div>

            <div class="login-footer">
                <a href="index.html" class="back-link">← Back to Website</a>
            </div>
        </div>

        <div class="login-decoration">
            <div class="orbit-ring orbit-1"></div>
            <div class="orbit-ring orbit-2"></div>
            <div class="orbit-ring orbit-3"></div>
            <div class="planet"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="auth.js"></script>
    <script>
        // Check if already logged in
        if (AstroAuth.isLoggedIn()) {
            if (AstroAuth.isAdmin()) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'member.html';
            }
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');

            const result = AstroAuth.login(username, password);

            if (result.success) {
                // Redirect based on role (determined by backend/auth.js)
                if (result.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    // Check for redirect after login
                    const redirectUrl = sessionStorage.getItem('redirectAfterLogin');
                    if (redirectUrl) {
                        sessionStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = 'member.html';
                    }
                }
            } else {
                errorEl.textContent = result.error;
                errorEl.style.display = 'block';

                // Shake animation
                this.classList.add('shake');
                setTimeout(() => this.classList.remove('shake'), 500);
            }
        });
    </script>
</body>

</html>
